name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create FREE plugin ZIP
        run: |
          cd ai-seo-rankmath-free
          zip -r ../ai-seo-rankmath-free.zip . -x "*.git*" -x "*.DS_Store" -x "Thumbs.db"
          cd ..

      - name: Create PRO plugin ZIP
        run: |
          cd ai-seo-rankmath-pro
          zip -r ../ai-seo-rankmath-pro.zip . -x "*.git*" -x "*.DS_Store" -x "Thumbs.db"
          cd ..

      - name: Generate changelog for release
        id: changelog
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          CHANGELOG=$(sed -n "/## \[$VERSION\]/,/## \[/p" CHANGELOG.md | sed '$d' | tail -n +2)
          
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="Release version $VERSION"
          fi
          
          echo "$CHANGELOG" > release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ai-seo-rankmath-free.zip
            ai-seo-rankmath-pro.zip
          body_path: release_notes.md
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update update.json for WordPress
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          cat > update.json << EOF
          {
            "name": "AI SEO Assistant for Rank Math PRO",
            "slug": "ai-seo-rankmath-pro",
            "version": "$VERSION",
            "download_url": "https://github.com/pereira-lui/ai-seo-wp-rank-math/releases/download/v$VERSION/ai-seo-rankmath-pro.zip",
            "requires": "5.8",
            "tested": "6.6",
            "requires_php": "7.4",
            "last_updated": "$(date -u +%Y-%m-%d)",
            "sections": {
              "description": "Preenche automaticamente os campos do Rank Math SEO usando ChatGPT. Versão PRO.",
              "changelog": "Veja o changelog completo em https://github.com/pereira-lui/ai-seo-wp-rank-math/blob/main/CHANGELOG.md"
            }
          }
          EOF

      - name: Commit update.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git checkout main
          git add update.json
          git diff --staged --quiet || git commit -m "Update update.json for v${{ steps.get_version.outputs.VERSION }}"
          git push origin main
